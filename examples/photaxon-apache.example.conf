<VirtualHost *:443>
  ServerName [PUBLIC_DOMAIN]

  DocumentRoot /var/www/photaxon

  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/example.crt
  SSLCertificateKeyFile /etc/ssl/private/example.key

  <Directory /var/www/photaxon>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  ProxyPass "/fiberspider/api/" "http://[FIBERSPIDER_BACKEND]/fiberspider/api/"
  ProxyPassReverse "/fiberspider/api/" "http://[FIBERSPIDER_BACKEND]/fiberspider/api/"

  <Location /fiberspider/api/>
    Require all granted
  </Location>

  ErrorLog ${APACHE_LOG_DIR}/photaxon_error.log
  CustomLog ${APACHE_LOG_DIR}/photaxon_access.log combined
</VirtualHost>
